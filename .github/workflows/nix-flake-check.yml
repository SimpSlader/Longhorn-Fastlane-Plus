name: Nix Flake Check
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  nix-flake:
    name: Nix Flake Check
    # Fastlane fork: opt-in (ENABLE_NIX_CHECK=true). After dependency changes, refresh nix/pnpm-hash with
    # `nix run .#update-hash` on a machine with Nix before enabling. Not part of the extension release.
    if: vars.ENABLE_NIX_CHECK == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check flake
        run: nix flake check

name: 'Chromatic'
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  chromatic:
    # Fastlane fork: off by default — the embedded token publishes to UT Registration Plus's Chromatic project.
    # Set repository variable ENABLE_CHROMATIC=true only with this fork's own Chromatic project token.
    if: vars.ENABLE_CHROMATIC == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Publish to Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: chpt_cc07511614f734c # bleh, but not really that a "secret", and necessary to expose for forks to build on chromatic
          exitZeroOnChanges: true
          autoAcceptChanges: 'main'

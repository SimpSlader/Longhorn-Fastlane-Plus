name: Fastlane CI
# Type-check, unit tests, dataset integrity, build, MV3 security check, end-to-end tests in Chromium,
# and an installable ZIP artifact for every push and pull request.
on:
  push:
    branches: [fastlane-plus, main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    # a hung browser test fails the check instead of blocking a merge for an hour
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # on pull requests the separate "type-check" and "test" checks already run these
      - name: Type check
        if: github.event_name != 'pull_request'
        run: pnpm check-types
      - name: Unit tests
        if: github.event_name != 'pull_request'
        run: pnpm vitest run --reporter=default --reporter=json --outputFile=reports/unit-results.json
      - name: Bundled dataset manifest is current
        run: pnpm data:check
      - name: Build
        run: pnpm build
      - name: MV3 / store security check
        run: pnpm security:check
      - name: Package
        run: node scripts/fastlane/package.mjs
      - name: Security check on the packaged ZIP
        run: |
          mkdir -p /tmp/zip-under-test && unzip -q package/*.zip -d /tmp/zip-under-test
          node scripts/fastlane/security-check.mjs /tmp/zip-under-test
      # Chromium is downloaded once per Playwright version, not on every run
      - name: Cache Playwright's Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: End-to-end tests against the packaged ZIP (fresh Chromium profile per test)
        run: |
          pnpm exec playwright install --with-deps chromium
          FASTLANE_EXTENSION_DIR=/tmp/zip-under-test pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fastlane-build-${{ github.sha }}
          path: |
            package/
            reports/
            test-results/
            store-assets/screenshots/

name: Publish public datasets (GitHub Pages)
# Publishes DATA ONLY (SQLite/JSON + manifest with SHA-256) for optional in-extension updates.
# Only datasets listed in docs/DATA_SOURCES.md as redistributable may be published here.
#
# DISABLED BY DEFAULT: public hosting of the grade dataset is on hold until redistribution is approved
# (see docs/GRADE_DATA_PROVENANCE.md). Running it requires BOTH the repository variable
# DATASET_REDISTRIBUTION_APPROVED=true AND typing the confirmation phrase below. No push trigger.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "I confirm redistribution of this dataset was approved" to publish
        required: true
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    if: vars.DATASET_REDISTRIBUTION_APPROVED == 'true' && inputs.confirm == 'I confirm redistribution of this dataset was approved'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build dataset site
        run: node scripts/fastlane/publish-datasets.mjs "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data" site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
